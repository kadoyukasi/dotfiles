model = "gpt-6.2-sol"
model_reasoning_effort = "medium"
model_verbosity = "low"
personality = "pragmatic"

approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"
service_tier = "default"

[windows]
sandbox = "unelevated"

[plugins."documents@openai-primary-runtime"]
enabled = false

[plugins."spreadsheets@openai-primary-runtime"]
enabled = false

[plugins."presentations@openai-primary-runtime"]
enabled = false

[plugins."github@openai-curated"]
enabled = false

[plugins."hugging-face@openai-curated"]
enabled = true

[plugins."test-android-apps@openai-curated"]
enabled = true

[plugins."expo@openai-curated"]
enabled = true

[plugins."canva@openai-curated"]
enabled = true

[plugins."context-mode@context-mode"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = false

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."unified-computer-use@openai-bundled"]
enabled = true

[mcp_servers.serena]
enabled = false
startup_timeout_sec = 60
command = "uvx"
args = ["-p", "3.13", "--from", "serena-agent", "serena", "start-mcp-server", "--project-from-cwd", "--context=codex"]

[features]
hooks = true
memories = true
goals = true
workspace_dependencies = true

[desktop]
ambient-suggestions-enabled = true
conversationDetailMode = "STEPS_COMMANDS"
browser-annotation-screenshots-mode = "necessary"
git-show-sidebar-pr-icons = true
git-commit-instructions = """
When asked to commit, inspect git status and the diff, then stage only the intended changes.
Use Conventional Commits with a short imperative subject: type(scope): summary.
The scope is optional. Add a body or footer when needed, including BREAKING CHANGE for compatibility breaks.
"""
show-context-window-usage = true
followUpQueueMode = "queue"

[memories]
disable_on_external_context = true
